<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Ohio State AI Club</title>
    <!--
      Applies the stored theme BEFORE first paint. Must stay inline and blocking:
      the module bundle loads too late, so deferring this flashes a white page at
      every dark-mode visitor. Key must match THEME_STORAGE_KEY in src/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('osu-aic-theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage blocked — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
